<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Old links pointed at the forest story on this page (#page-N): send them to its reader.
  if (/^#page-\d+$/.test(location.hash)) location.replace("read.html?s=forest" + location.hash);
</script>
<meta property="og:title" content="قصص علي دياب · Les histoires d'Ali Diab · Ali Diab's stories">
<meta property="og:description" content="كتب متحرّكة بالعربية والفرنسية والإنكليزية · Livres animés · Animated storybooks">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ali Diab Stories</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a bookshelf at night; each cover is a floating book you tap to open. Single dark look, like the reader. */
:root {
  --night: #0d1730;
  --night-2: #172a52;
  --gold: #f4c14f;
  --gold-soft: #ffe7a3;
  --parch: #fbf3dc;
  --ink: #1c2550;
  --muted: #b9c3e6;
  --red: #e0262f;
  --display: "Baloo Bhaijaan 2", "Nunito", system-ui, sans-serif;
  --arabic: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 65%) fixed, var(--night);
  background-color: var(--night);
  color: var(--parch);
  font-family: var(--display);
  overflow-x: hidden;
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: clamp(24px, 4vw, 44px);
}
header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.eyebrow { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-size: .85rem; }
h1 { margin: 0; font-family: var(--arabic); font-weight: 800; font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.1; color: var(--gold-soft); text-shadow: 0 4px 0 #8a5a12, 0 10px 30px rgba(0,0,0,.5); }
.sub { margin: 0; font-weight: 700; font-size: clamp(1.05rem, 2.4vw, 1.4rem); color: var(--parch); }
.hint { margin: 4px 0 0; color: var(--muted); font-size: 1rem; max-width: 52ch; line-height: 1.5; }

.shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 300px)); justify-content: center; gap: clamp(26px, 4vw, 48px); align-items: start; }
.book {
  display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: inherit;
  perspective: 1200px; border-radius: 16px; outline: none;
  animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
}
.book:nth-child(2) { animation-delay: .12s } .book:nth-child(3) { animation-delay: .24s } .book:nth-child(4) { animation-delay: .36s }
@keyframes rise { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
.cover-box { position: relative; transform-style: preserve-3d; animation: floaty 6s ease-in-out infinite; }
.book:nth-child(even) .cover-box { animation-delay: -3s; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotateY(-7deg) rotateZ(-1deg) } 50% { transform: translateY(-10px) rotateY(6deg) rotateZ(1deg) } }
.cover-box img {
  display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px;
  box-shadow: 0 0 0 3px var(--gold), 0 0 44px rgba(244,193,79,.32), 0 26px 50px rgba(0,0,0,.55);
  transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
}
.cover-box::before { /* book spine */
  content: ""; position: absolute; top: 2%; bottom: 2%; left: -9px; width: 12px; border-radius: 6px 0 0 6px;
  background: linear-gradient(90deg, #6b4510, #b9862a); box-shadow: -2px 6px 14px rgba(0,0,0,.4);
}
.book:hover .cover-box img, .book:focus-visible .cover-box img { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 0 3px var(--gold-soft), 0 0 70px rgba(244,193,79,.55), 0 34px 60px rgba(0,0,0,.6); }
.book:focus-visible .cover-box img { outline: 3px solid var(--gold-soft); outline-offset: 6px; }
.ribbon {
  position: absolute; top: 14px; right: -10px; z-index: 2;
  background: var(--red); color: #fff; font-weight: 800; font-size: .9rem; padding: 5px 14px;
  border-radius: 6px 6px 0 6px; box-shadow: 0 6px 14px rgba(0,0,0,.35);
  animation: pulse 2.4s ease-in-out infinite;
}
.ribbon::after { content: ""; position: absolute; right: 0; bottom: -8px; border: 4px solid #8f1018; border-bottom-color: transparent; border-right-color: transparent; }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
.meta { display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center; }
.meta .t-ar { font-family: var(--arabic); font-weight: 800; font-size: 1.3rem; line-height: 1.3; color: var(--gold-soft); }
.meta .t-lat { font-weight: 700; color: var(--parch); font-size: .98rem; line-height: 1.35; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.badge { border: 1px solid rgba(244,193,79,.45); border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .8rem; color: var(--gold-soft); }
.badge.pages { color: var(--muted); border-color: rgba(185,195,230,.35); }
.read-cta {
  margin-top: 4px; border-radius: 999px; padding: 9px 22px;
  background: linear-gradient(180deg, var(--gold-soft), var(--gold)); color: var(--ink); font-weight: 800; font-size: 1rem;
  box-shadow: 0 5px 0 #9a6a14, 0 12px 24px rgba(244,193,79,.3);
}
.book.opening .cover-box { animation: none; }
.book.opening .cover-box img { transform: scale(1.12) rotateY(-24deg); transition: transform .5s cubic-bezier(.5,0,.7,.4), opacity .5s; opacity: .2; }
@media (prefers-reduced-motion: reduce) {
  .cover-box, .ribbon, .book { animation: none; }
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="eyebrow">Les histoires d'Ali Diab · Ali Diab's stories</div>
    <h1 lang="ar" dir="rtl">مكتبة قصص علي دياب</h1>
    <p class="sub">Choisis ton histoire · Choose your story</p>
    <p class="hint" lang="ar" dir="rtl">اختر غلاف القصة التي تريد أن تقرأها</p>
  </header>
  <section class="shelf" id="shelf" aria-label="Stories"></section>
</main>

<script src="stories/library.js"></script>
<script>
const NAMES = { ar: "العربية", fr: "Français", en: "English" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shelf = document.getElementById("shelf");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
shelf.innerHTML = (window.LIBRARY || []).map(b => {
  const lat = [b.title.fr, b.title.en].filter(Boolean);
  return `<a class="book" href="read.html?s=${encodeURIComponent(b.id)}">
    <div class="cover-box">
      ${b.isNew ? '<span class="ribbon">جديد · New</span>' : ""}
      <img src="stories/${esc(b.id)}/img/p00.jpg" alt="${esc(b.alt || "")}" loading="lazy">
    </div>
    <div class="meta">
      <div class="t-ar" lang="ar" dir="rtl">${esc(b.title.ar)}</div>
      ${lat.map(t => `<div class="t-lat">${esc(t)}</div>`).join("")}
      <div class="badges">${b.langs.map(l => `<span class="badge" lang="${l}">${NAMES[l]}</span>`).join("")}<span class="badge pages">${b.pages} pages</span></div>
      <span class="read-cta">اقرأ · Lire · Read</span>
    </div>
  </a>`;
}).join("");
// small "book opens" animation before leaving
shelf.addEventListener("click", e => {
  const a = e.target.closest("a.book");
  if (!a || reduced || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault();
  a.classList.add("opening");
  setTimeout(() => { location.href = a.href; }, 420);
});
addEventListener("pageshow", () => document.querySelectorAll(".book.opening").forEach(b => b.classList.remove("opening")));

/* fireflies */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
let W, H, parts = [];
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", resize); resize();
const rnd = (a, b) => a + Math.random() * (b - a);
const spawn = () => ({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-.3, .3), vy: rnd(-.4, .1), r: rnd(1.2, 3), ph: rnd(0, 6), life: 0 });
parts = Array.from({ length: reduced ? 12 : 40 }, spawn);
let last = performance.now();
(function frame(now) {
  const dt = Math.min(3, (now - last) / 16.7); last = now;
  cx.clearRect(0, 0, W, H);
  parts.forEach((p, k) => {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = .2 + .6 * Math.abs(Math.sin(p.life * .03 + p.ph));
    const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
    g.addColorStop(0, `rgba(255,226,140,${a})`); g.addColorStop(1, "rgba(255,226,140,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 7); cx.fill();
    if (p.y < -20 || p.y > H + 30 || p.x < -20 || p.x > W + 20) parts[k] = Object.assign(spawn(), { y: H + 10 });
  });
  requestAnimationFrame(frame);
})(last);
</script>
</body>
</html>
